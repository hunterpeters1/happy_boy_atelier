<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload From Phone</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    /* Same brass/graphite instrument-panel palette as the desktop app
       itself (app/constants.py's dark-mode values) -- see index.html's
       matching comment. Same typeface too (Space Grotesk, the app's own
       bundled UI font, also used in the app icon's "HB" mark) -- colors
       alone tied this page to the app, but the lettering itself didn't
       until now. Variable font, so one @font-face covers every weight
       used below via plain `font-weight` instead of one static file per
       weight. */
    @font-face {
      font-family: "Space Grotesk";
      src: url("{{ url_for('static', filename='fonts/SpaceGrotesk-VariableFont_wght.ttf') }}") format("truetype-variations");
      font-weight: 300 700;
    }
    :root {
      color-scheme: dark;
      --bg: #15171a;
      --bg-panel: #20242a;
      --line: #3a4048;
      --ink: #e8e6df;
      --ink-dim: #9a9d9f;
      --brass: #c9a05c;
      --brass-bright: #e0b876;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
    }
    input[type="text"] {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 1.6rem;
      letter-spacing: 0.35em;
      text-align: center;
      padding: 12px;
      /* 2px, not a rounder value -- matches the real app's own
         QLineEdit/QPushButton radius (app/theme.py); only actually
         circular controls (a dial, a radio button) get fully round
         corners there. */
      border-radius: 2px;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      color: var(--brass-bright);
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--brass);
    }
    button {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 12px;
      border-radius: 2px;
      border: 1px solid var(--brass);
      background: var(--brass);
      color: #1b1e0e;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:active { background: var(--brass-bright); border-color: var(--brass-bright); }
    .error { color: #d16a5a; font-size: 0.9rem; margin: 0; }
    .remember {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--ink-dim);
      cursor: pointer;
      user-select: none;
    }
    .remember input { accent-color: var(--brass); width: 16px; height: 16px; }
  </style>
</head>
<body>
  <form method="post" action="{{ url_for('login') }}">
    <h1>Enter the PIN shown on the laptop</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <input
      type="text"
      name="pin"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="6"
      autocomplete="off"
      autofocus
      required>
    <label class="remember">
      <input type="checkbox" name="remember" checked>
      Remember this device — skip the PIN next time
    </label>
    <button type="submit">Unlock</button>
  </form>
</body>
</html>
