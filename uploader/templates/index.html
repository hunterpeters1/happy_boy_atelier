<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload From Phone</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    /* Same brass/graphite instrument-panel palette as the desktop app
       itself (app/constants.py's dark-mode values) -- a subtle, deliberate
       tie-in rather than a generic dark-mode blue accent, since this page
       is this app's companion, not an unrelated tool. Same typeface too
       (Space Grotesk, the app's own bundled UI font, also used in the app
       icon's "HB" mark) -- colors alone tied this page to the app, but
       the lettering itself didn't until now. Variable font, so one
       @font-face covers every weight used below via plain `font-weight`
       instead of one static file per weight. */
    @font-face {
      font-family: "Space Grotesk";
      src: url("{{ url_for('static', filename='fonts/SpaceGrotesk-VariableFont_wght.ttf') }}") format("truetype-variations");
      font-weight: 300 700;
    }
    :root {
      color-scheme: dark;
      --bg: #15171a;
      --bg-panel: #20242a;
      --bg-raised: #282d34;
      --line: #3a4048;
      --ink: #e8e6df;
      --ink-dim: #9a9d9f;
      --brass: #c9a05c;
      --brass-bright: #e0b876;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 16px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
      text-align: center;
    }
    .rule {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--brass) 50%, transparent);
      opacity: 0.5;
      margin: 0 0 20px;
    }
    .drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px dashed var(--line);
      /* 2px, not a rounder value -- matches the real app's own
         QLineEdit/QPushButton radius (app/theme.py); only actually
         circular controls (a dial, a radio button) get fully round
         corners there. Same reasoning below for the gallery thumbnails. */
      border-radius: 2px;
      background: var(--bg-panel);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.dragover { border-color: var(--brass); background: var(--bg-raised); }
    .drop-zone .big { font-size: 1.05rem; font-weight: 600; }
    .drop-zone .small { font-size: 0.85rem; color: var(--ink-dim); }
    /* Visually hidden but still rendered -- iOS Safari can fall back to
       a bare Files browser (no Photo Library/Camera option) if the file
       input is display:none when its label is tapped. */
    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .status {
      min-height: 1.4em;
      text-align: center;
      margin: 12px 0;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: var(--ink-dim);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .gallery a {
      display: block;
      aspect-ratio: 1 / 1;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg-panel);
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .empty {
      text-align: center;
      color: var(--ink-dim);
      margin-top: 24px;
      font-size: 0.9rem;
    }
    .forget-device {
      display: block;
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--ink-dim);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      width: 100%;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Happy Boy Atelier &mdash; Upload From Phone</h1>
  <div class="rule"></div>

  <label class="drop-zone" id="dropZone" for="fileInput">
    <span class="big">Tap to choose photos</span>
    <span class="small">or drag and drop here</span>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>

  <p class="status" id="status"></p>

  <div class="gallery" id="gallery"></div>
  <p class="empty" id="emptyState" hidden>No photos yet.</p>

  <button type="button" class="forget-device" id="forgetDeviceBtn">Forget this device</button>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");
    const emptyStateEl = document.getElementById("emptyState");
    const forgetDeviceBtn = document.getElementById("forgetDeviceBtn");

    forgetDeviceBtn.addEventListener("click", async () => {
      if (!confirm("Forget this device? You'll need the PIN again next time.")) return;
      await fetch("/forget-device", { method: "POST" });
      window.location.href = "/login";
    });

    async function uploadFiles(files) {
      const list = Array.from(files);
      if (list.length === 0) return;

      let succeeded = 0;
      let failed = 0;
      statusEl.textContent = `Uploading 0 / ${list.length}...`;

      for (let i = 0; i < list.length; i++) {
        const formData = new FormData();
        formData.append("file", list[i]);
        try {
          const response = await fetch("/upload", { method: "POST", body: formData });
          const data = await response.json();
          if (data.ok) {
            succeeded++;
          } else {
            failed++;
          }
        } catch (err) {
          failed++;
        }
        statusEl.textContent = `Uploading ${i + 1} / ${list.length}...`;
      }

      statusEl.textContent = failed === 0
        ? `${succeeded} photo${succeeded === 1 ? "" : "s"} uploaded.`
        : `${succeeded} uploaded, ${failed} failed.`;

      refreshGallery();
    }

    fileInput.addEventListener("change", () => {
      uploadFiles(fileInput.files);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });

    dropZone.addEventListener("drop", (event) => {
      if (event.dataTransfer && event.dataTransfer.files.length) {
        uploadFiles(event.dataTransfer.files);
      }
    });

    function renderGallery(photos) {
      galleryEl.innerHTML = "";
      emptyStateEl.hidden = photos.length > 0;

      for (const photo of photos) {
        const link = document.createElement("a");
        link.href = `/photos_dir/${encodeURIComponent(photo.filename)}`;
        link.target = "_blank";
        link.rel = "noopener";

        const img = document.createElement("img");
        img.src = photo.thumbnail
          ? `/thumbnails/${encodeURIComponent(photo.thumbnail)}`
          : `/photos_dir/${encodeURIComponent(photo.filename)}`;
        img.loading = "lazy";
        img.alt = photo.filename;

        link.appendChild(img);
        galleryEl.appendChild(link);
      }
    }

    async function refreshGallery() {
      try {
        const response = await fetch("/photos");
        const photos = await response.json();
        renderGallery(photos);
      } catch (err) {
        // Next poll tick will retry.
      }
    }

    refreshGallery();
    setInterval(refreshGallery, 3000);
  </script>
</body>
</html>
