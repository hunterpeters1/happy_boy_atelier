<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload From Phone</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    /* Same brass/graphite instrument-panel palette as the desktop app
       itself (app/constants.py's dark-mode values) -- a subtle, deliberate
       tie-in rather than a generic dark-mode blue accent, since this page
       is this app's companion, not an unrelated tool. Same typeface too
       (Space Grotesk, the app's own bundled UI font, also used in the app
       icon's "HB" mark) -- colors alone tied this page to the app, but
       the lettering itself didn't until now. Variable font, so one
       @font-face covers every weight used below via plain `font-weight`
       instead of one static file per weight. */
    @font-face {
      font-family: "Space Grotesk";
      src: url("{{ url_for('static', filename='fonts/SpaceGrotesk-VariableFont_wght.ttf') }}") format("truetype-variations");
      font-weight: 300 700;
    }
    :root {
      color-scheme: dark;
      --bg: #15171a;
      --bg-panel: #20242a;
      --bg-raised: #282d34;
      --line: #3a4048;
      --ink: #e8e6df;
      --ink-dim: #9a9d9f;
      --brass: #c9a05c;
      --brass-bright: #e0b876;
      --error: #d16a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 16px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
      text-align: center;
    }
    .rule {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--brass) 50%, transparent);
      opacity: 0.5;
      margin: 0 0 20px;
    }
    .drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px dashed var(--line);
      /* 2px, not a rounder value -- matches the real app's own
         QLineEdit/QPushButton radius (app/theme.py); only actually
         circular controls (a dial, a radio button) get fully round
         corners there. Same reasoning below for the gallery thumbnails. */
      border-radius: 2px;
      background: var(--bg-panel);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.dragover { border-color: var(--brass); background: var(--bg-raised); }
    .drop-zone .big { font-size: 1.05rem; font-weight: 600; }
    .drop-zone .small { font-size: 0.85rem; color: var(--ink-dim); }
    /* Visually hidden but still rendered -- iOS Safari can fall back to
       a bare Files browser (no Photo Library/Camera option) if the file
       input is display:none when its label is tapped. */
    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .status {
      min-height: 1.4em;
      text-align: center;
      margin: 12px 0;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: var(--ink-dim);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .gallery a {
      display: block;
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg-panel);
    }
    .gallery a.pending { pointer-events: none; }
    .gallery a.errored { border-color: var(--error); }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .gallery img.loaded { opacity: 1; }
    /* Overlay for the two transient tile states (uploading / failed) --
       absent entirely once a tile settles into its normal done state, so
       a finished tile is pixel-identical to one rendered from a plain
       server poll (see the "why two code paths would drift" note in the
       script below). A genuinely circular spinner, in line with this
       app's own convention (theme.py: only actually-round controls get
       full border-radius, everything else stays near-sharp at 2px). */
    .tile-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(21, 23, 26, 0.55);
    }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      border-top-color: var(--brass);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tile-error-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--error);
      color: var(--bg);
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty {
      text-align: center;
      color: var(--ink-dim);
      margin-top: 24px;
      font-size: 0.9rem;
    }
    .forget-device {
      display: block;
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--ink-dim);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      width: 100%;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Happy Boy Atelier &mdash; Upload From Phone</h1>
  <div class="rule"></div>

  <label class="drop-zone" id="dropZone" for="fileInput">
    <span class="big">Tap to choose photos</span>
    <span class="small">or drag and drop here</span>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>

  <p class="status" id="status"></p>

  <div class="gallery" id="gallery"></div>
  <p class="empty" id="emptyState" hidden>No photos yet.</p>

  <button type="button" class="forget-device" id="forgetDeviceBtn">Forget this device</button>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");
    const emptyStateEl = document.getElementById("emptyState");
    const forgetDeviceBtn = document.getElementById("forgetDeviceBtn");

    // Filenames already represented as a tile in the DOM -- either one of
    // our own uploads that finished, or one refreshGallery() found on a
    // poll. Lets refreshGallery() (which runs every 3s, from any device
    // on this session) add tiles for photos *other* phones just uploaded
    // without ever touching -- or duplicating -- a tile already on
    // screen, including one still mid-upload that the server doesn't
    // know about yet.
    const knownFilenames = new Set();

    // Guards refreshGallery() against the race described in its own
    // comment below -- non-zero for the whole duration of any batch this
    // page is actively uploading.
    let uploadsInFlight = 0;

    function updateEmptyState() {
      emptyStateEl.hidden = galleryEl.children.length > 0;
    }

    function insertTileAtFront(el) {
      galleryEl.insertBefore(el, galleryEl.firstChild);
      updateEmptyState();
    }

    // A tile is always the same markup whether it came from a server poll
    // (createDoneTile) or from our own in-flight upload settling
    // (buildPendingTile's completion path) -- a finished upload must be
    // pixel-identical to a plain server-rendered one, not a permanently
    // different "just uploaded" style, or the two code paths would
    // visibly drift from each other over time.
    function createDoneTile(filename, thumbnail) {
      const link = document.createElement("a");
      link.href = `/photos_dir/${encodeURIComponent(filename)}`;
      link.target = "_blank";
      link.rel = "noopener";

      const img = document.createElement("img");
      img.src = thumbnail
        ? `/thumbnails/${encodeURIComponent(thumbnail)}`
        : `/photos_dir/${encodeURIComponent(filename)}`;
      img.loading = "lazy";
      img.alt = filename;
      img.addEventListener("load", () => img.classList.add("loaded"));

      link.appendChild(img);
      return link;
    }

    // Downscaled local preview, generated entirely client-side, so a
    // tile can appear the instant a photo is picked instead of waiting
    // on the upload round-trip. createImageBitmap's resize option decodes
    // *and* downscales in one step -- the browser never has to hold a
    // full decode of a 12-48MP phone photo just to paint a ~100px tile,
    // which is what plain `URL.createObjectURL(file)` on an <img> would
    // do. Falls back to that plain approach only where createImageBitmap
    // isn't available at all (broadly supported on the mobile Safari/
    // Chrome this page actually targets) -- worse for a moment on that
    // one path, never worse than what this page already did before.
    const PREVIEW_PX = 160;

    async function makeLocalPreview(file) {
      if ("createImageBitmap" in window) {
        try {
          const bitmap = await createImageBitmap(file, { resizeWidth: PREVIEW_PX, resizeQuality: "medium" });
          const canvas = document.createElement("canvas");
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          canvas.getContext("2d").drawImage(bitmap, 0, 0);
          bitmap.close();
          // A data URL, not a blob URL -- a few KB of string, nothing to
          // revoke, unlike the full-resolution fallback below.
          return { src: canvas.toDataURL("image/jpeg", 0.7), revoke: null };
        } catch (err) {
          // Fall through to the fallback below (e.g. a format
          // createImageBitmap can't decode on this browser).
        }
      }
      const src = URL.createObjectURL(file);
      return { src, revoke: src };
    }

    function buildPendingTile() {
      const link = document.createElement("a");
      link.classList.add("pending");

      const img = document.createElement("img");
      link.appendChild(img);

      const overlay = document.createElement("div");
      overlay.className = "tile-overlay";
      const spinner = document.createElement("div");
      spinner.className = "spinner";
      overlay.appendChild(spinner);
      link.appendChild(overlay);

      return { link, img, overlay };
    }

    async function settleTile(tile, file) {
      const { link, img, overlay } = tile;
      const formData = new FormData();
      formData.append("file", file);
      try {
        const response = await fetch("/upload", { method: "POST", body: formData });
        const data = await response.json();
        if (data.ok) {
          knownFilenames.add(data.filename);
          link.href = `/photos_dir/${encodeURIComponent(data.filename)}`;
          link.target = "_blank";
          link.rel = "noopener";
          link.classList.remove("pending");
          if (data.thumbnail) {
            // The small server-rendered thumbnail replaces our local
            // preview once it exists -- no reason to keep holding even
            // the downscaled preview once the real thing is available.
            img.classList.remove("loaded");
            img.src = `/thumbnails/${encodeURIComponent(data.thumbnail)}`;
            img.addEventListener("load", () => img.classList.add("loaded"), { once: true });
          }
          if (link._revokePreview) URL.revokeObjectURL(link._revokePreview);
          overlay.remove();
          return true;
        }
        throw new Error(data.error || "Upload failed.");
      } catch (err) {
        link.classList.remove("pending");
        link.classList.add("errored");
        overlay.innerHTML = "";
        const badge = document.createElement("div");
        badge.className = "tile-error-badge";
        badge.textContent = "!";
        badge.title = "Upload failed";
        overlay.appendChild(badge);
        return false;
      }
    }

    async function uploadFiles(files) {
      const list = Array.from(files);
      if (list.length === 0) return;

      // Every tile for the whole batch appears immediately, in the
      // order the files were picked -- not one at a time as each
      // upload starts. anchor is captured once, before any inserting:
      // insertBefore(newTile, anchor) against that same fixed node,
      // repeated in file order, builds the new block in the right
      // order while still landing it entirely ahead of whatever tiles
      // already existed.
      const anchor = galleryEl.firstChild;
      const tiles = list.map((file) => {
        const tile = buildPendingTile();
        galleryEl.insertBefore(tile.link, anchor);
        // Preview decode and the eventual upload proceed independently
        // -- every preview starts decoding right away, in parallel
        // across the whole batch (cheap: it's a downscaled decode, see
        // makeLocalPreview), well before this file's own turn in the
        // sequential upload loop below.
        makeLocalPreview(file).then(({ src, revoke }) => {
          tile.img.src = src;
          tile.img.addEventListener("load", () => tile.img.classList.add("loaded"), { once: true });
          tile.link._revokePreview = revoke;
        });
        return tile;
      });
      updateEmptyState();

      let succeeded = 0;
      let failed = 0;
      statusEl.textContent = `Uploading 0 / ${list.length}...`;

      uploadsInFlight++;
      try {
        // Actual network upload stays sequential, one at a time -- gentle
        // on a phone's uplink, unchanged from before this feature.
        for (let i = 0; i < list.length; i++) {
          const ok = await settleTile(tiles[i], list[i]);
          if (ok) succeeded++; else failed++;
          statusEl.textContent = `Uploading ${i + 1} / ${list.length}...`;
        }
      } finally {
        uploadsInFlight--;
      }

      statusEl.textContent = failed === 0
        ? `${succeeded} photo${succeeded === 1 ? "" : "s"} uploaded.`
        : `${succeeded} uploaded, ${failed} failed.`;
    }

    fileInput.addEventListener("change", () => {
      uploadFiles(fileInput.files);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });

    dropZone.addEventListener("drop", (event) => {
      if (event.dataTransfer && event.dataTransfer.files.length) {
        uploadFiles(event.dataTransfer.files);
      }
    });

    forgetDeviceBtn.addEventListener("click", async () => {
      if (!confirm("Forget this device? You'll need the PIN again next time.")) return;
      await fetch("/forget-device", { method: "POST" });
      window.location.href = "/login";
    });

    // Only ever adds tiles for photos this page doesn't already know
    // about (another device's upload) -- never rebuilds the grid, so it
    // can't clobber a tile that's still mid-upload locally. Server order
    // is newest-first; walked in reverse so each still-new insert-at-
    // front leaves the final DOM order newest-first too.
    //
    // Skipped entirely while our own upload is in flight (uploadsInFlight,
    // set in uploadFiles()) -- a real race otherwise: the server has
    // already written the file to disk (so /photos reports it) before
    // this page's own fetch("/upload") for that exact file has resolved
    // and added its filename to knownFilenames, so a poll landing in
    // that window saw it as "unseen" and inserted a second tile for a
    // photo that was about to get its own pending tile marked done --
    // caught by an automated test exercising this with an artificial
    // upload delay, not by inspection.
    async function refreshGallery() {
      if (uploadsInFlight > 0) return;
      try {
        const response = await fetch("/photos");
        const photos = await response.json();
        const unseen = photos.filter((p) => !knownFilenames.has(p.filename));
        for (const photo of unseen.reverse()) {
          knownFilenames.add(photo.filename);
          insertTileAtFront(createDoneTile(photo.filename, photo.thumbnail));
        }
        // Still needed even when unseen is empty -- insertTileAtFront()
        // only runs (and so only calls this) when something was actually
        // added, but "zero photos, first poll ever" must still flip
        // emptyStateEl on, which nothing else does for it.
        updateEmptyState();
      } catch (err) {
        // Next poll tick will retry.
      }
    }

    refreshGallery();
    setInterval(refreshGallery, 3000);
  </script>
</body>
</html>
